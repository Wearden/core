server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Client-side routing: every other path returns the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
