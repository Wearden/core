name: wearden
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wearden}
      POSTGRES_DB: ${POSTGRES_DB:-wearden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-wearden}
      DATABASE_USER: ${POSTGRES_USER:-wearden}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DATABASE_SSLMODE: disable
      LISTEN_ADDR: 0.0.0.0:8000
      RULESET_PATH: /app/ruleset
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      WEARDEN_VAULT_KEY: ${WEARDEN_VAULT_KEY:-}
      GUAC_CRYPT_KEY: ${GUAC_CRYPT_KEY:-}
      GUAC_CONTROL_KEY: ${GUAC_CONTROL_KEY:-}
      RECORDINGS_DIR: /data/recordings
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - ${RULESET_PATH:-../ruleset}:/app/ruleset:ro
      - recordings:/data/recordings:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
  guacd:
    profiles: [sessions]
    image: guacamole/guacd:1.5.5
    volumes:
      - recordings:/data/recordings
    restart: unless-stopped
  guac-tunnel:
    profiles: [sessions]
    build: ./guac-tunnel
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      TUNNEL_PORT: "8080"
      GUAC_CRYPT_KEY: ${GUAC_CRYPT_KEY:-}
      GUAC_CONTROL_KEY: ${GUAC_CONTROL_KEY:-}
      CORE_INTERNAL_URL: http://backend:8000
    depends_on:
      - guacd
    restart: unless-stopped
volumes:
  postgres_data:
  recordings:
