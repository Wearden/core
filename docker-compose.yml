name: wearden
services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ:-Asia/Baku}
      POSTGRES_USER: ${POSTGRES_USER:-wearden}
      POSTGRES_DB: ${POSTGRES_DB:-wearden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      TZ: ${TZ:-Asia/Baku}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-wearden}
      DATABASE_USER: ${POSTGRES_USER:-wearden}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DATABASE_SSLMODE: disable
      LISTEN_ADDR: 0.0.0.0:8000
      RULESET_PATH: /app/ruleset
      WEARDEN_VAULT_KEY: ${WEARDEN_VAULT_KEY:-}
      GUAC_CRYPT_KEY: ${GUAC_CRYPT_KEY:-}
      GUAC_CONTROL_KEY: ${GUAC_CONTROL_KEY:-}
      RECORDINGS_DIR: /data/recordings
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      AGENT_DOWNLOADS_DIR: /data/downloads
    volumes:
      - ${RULESET_PATH:-../ruleset}:/app/ruleset:ro
      - ${AGENT_DOWNLOADS_HOST_DIR:-./downloads}:/data/downloads:ro
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      TZ: ${TZ:-Asia/Baku}
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    environment:
      TZ: ${TZ:-Asia/Baku}
    ports:
      - "${WEARDEN_BIND:-127.0.0.1}:${WEARDEN_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    environment:
      TZ: ${TZ:-Asia/Baku}
      WEARDEN_DOMAIN: ${WEARDEN_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - nginx
    restart: unless-stopped
  # A new volume is owned by root, so guacd could not save recordings. Owner is guacd (uid 1000 in
  # guacamole/guacd) and the setgid group is the backend's wearden group (gid 101, core/Dockerfile).
  # The backend also runs as uid 1000, so it can read recordings and delete them when asked to.
  recordings-init:
    profiles: [sessions]
    image: alpine:3.22
    command: ["sh", "-c", "chown 1000:101 /data/recordings && chmod 2770 /data/recordings"]
    volumes:
      - recordings:/data/recordings
  guacd:
    profiles: [sessions]
    image: guacamole/guacd:1.5.5
    volumes:
      - recordings:/data/recordings
    depends_on:
      recordings-init:
        condition: service_completed_successfully
    restart: unless-stopped
  guac-tunnel:
    profiles: [sessions]
    build: ./guac-tunnel
    environment:
      TZ: ${TZ:-Asia/Baku}
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      TUNNEL_PORT: "8080"
      GUAC_CRYPT_KEY: ${GUAC_CRYPT_KEY:-}
      GUAC_CONTROL_KEY: ${GUAC_CONTROL_KEY:-}
      CORE_INTERNAL_URL: http://backend:8000
    depends_on:
      - guacd
    restart: unless-stopped
volumes:
  postgres_data:
  recordings:
  caddy_data:
